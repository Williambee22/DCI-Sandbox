<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DCI Sandbox</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div>
    <b>DCI SANDBOX</b>
    <span id="season"></span>
  </div>

  <div class="actions">
    <button id="step">Advance Day</button>
    <button id="week">+ 7 Days</button>
    <button id="auto">▶ Play</button>
    <button id="next">Next Season</button>

    <button id="reset" class="danger">
      Reset Everything
    </button>
  </div>
</header>


<main>

  <!-- GOD MODE HEADER -->
  <section class="hero">

    <div>
      <h1>God Mode</h1>

      <p>
        Run the activity. Build dynasties, wreck organizations,
        save corps, create new corps, or let the universe evolve.
      </p>
    </div>

    <div class="day">
      <small>SEASON DAY</small>
      <strong id="day">0 / 45</strong>
    </div>

  </section>


  <!-- SCORE GRAPH -->
  <section class="panel">

    <canvas
      id="chart"
      width="1200"
      height="430">
    </canvas>

  </section>


  <!-- MAIN GRID -->
  <section class="grid">

    <!-- STANDINGS -->
    <div class="panel">

      <h2>Live Standings</h2>

      <div id="standings"></div>

    </div>


    <!-- CORPS CONTROL -->
    <div class="panel">

      <h2>Corps Control</h2>

      <select id="corps"></select>

      <div id="controls"></div>

    </div>

  </section>


  <!-- CREATE NEW CORPS -->
  <section class="panel create-corps">

    <h2>Create New Corps</h2>

    <p>
      Add a new corps to the simulation.
      New corps begin with all organizational stats at 60.
    </p>

    <div class="create-corps-row">

      <input
        id="newCorpsName"
        type="text"
        maxlength="50"
        placeholder="Corps name..."
        autocomplete="off"
      >

      <button id="createCorps">
        + Create Corps
      </button>

    </div>

    <div id="createCorpsMessage"></div>

  </section>

</main>


<script src="/app.js"></script>

</body>
</html>
